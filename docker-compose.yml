services:
  ms-auth:
    image: ms-auth:v3
    ports:
      - '8080:8080'
    env_file:
      - ./src/AuthenticationService.API/.env
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started

  postgres:
    image: postgres:17
    env_file:
      - ./src/AuthenticationService.API/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
volumes:
  postgres-data:
